[project]
name = "instant-ppt-domain"
version = "2.1.0"
requires-python = ">=3.12.4,<3.13"
dependencies = [
  "alembic==1.19.1",
  "psycopg[binary]==3.3.4",
  "redis==6.4.0",
  "sqlalchemy==2.0.52",
]

[project.scripts]
instant-ppt-migrate = "instant_ppt_domain.migrations:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instant_ppt_domain"]
