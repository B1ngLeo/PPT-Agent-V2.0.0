        - outlineRevisionId
        - templateVersionId
        - modeId
        - sourceHashes
        - promptVersion
        - engineVersion
        - containerVersion
        - fontPackVersion
        - providerConfigVersion
        - snapshotSha256
        - createdAt
    SlidePlan:
      title: SlidePlan
      type: object
      additionalProperties: false
