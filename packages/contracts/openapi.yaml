components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UploadSession:
      title: UploadSession
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        uploadSessionId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        organizationId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        objectKey:
          type: string
          pattern: ^[a-z0-9][a-z0-9/_\-.]{0,511}$
        declaredMimeType:
          enum:
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/pdf
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
            - text/html
        expectedSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        maxBytes:
          type: integer
          minimum: 1
          maximum: 52428800
        expiresAt:
          type: string
          format: date-time
        status:
          enum:
            - pending
            - uploaded
            - completed
            - expired
            - rejected
      required:
        - schemaVersion
        - uploadSessionId
        - organizationId
        - objectKey
        - declaredMimeType
        - expectedSha256
        - maxBytes
        - expiresAt
        - status
    SourceArtifact:
      title: SourceArtifact
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        artifactId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        sourceId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        organizationId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        kind:
          enum:
            - markdown
            - asset
            - conversion_profile
        objectKey:
          type: string
          pattern: ^[a-z0-9][a-z0-9/_\-.]{0,511}$
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        mimeType:
          type: string
          minLength: 1
        sizeBytes:
          type: integer
          minimum: 0
        parserVersion:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
      required:
        - schemaVersion
        - artifactId
        - sourceId
        - organizationId
        - kind
        - objectKey
        - sha256
        - mimeType
        - sizeBytes
        - parserVersion
        - createdAt
    SourcePackage:
      title: SourcePackage
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        sourceId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        organizationId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        sourceSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        language:
          enum:
            - zh-CN
            - en-US
            - mixed
        markdownArtifactId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        assetArtifactIds:
          type: array
          items:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          uniqueItems: true
        conversionProfileArtifactId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        parserVersion:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
      required:
        - schemaVersion
        - sourceId
        - organizationId
        - sourceSha256
        - language
        - markdownArtifactId
        - assetArtifactIds
        - conversionProfileArtifactId
        - parserVersion
        - createdAt
    IntentSpec:
      title: IntentSpec
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        intentRevisionId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        title:
          type: string
          minLength: 1
        audience:
          type: string
          minLength: 1
        goal:
          type: string
          minLength: 1
        targetSlideCount:
          type: integer
          minimum: 4
          maximum: 30
        language:
          enum:
            - zh-CN
            - en-US
        contentDepth:
          enum:
            - conclusion_first
            - balanced
            - research
        visualPreference:
          enum:
            - data_first
            - photo_illustration
            - minimal_visual
        notes:
          type: string
          maxLength: 4000
        sourceRefs:
          type: array
          items:
            type: string
            pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
          uniqueItems: true
      required:
        - schemaVersion
        - intentRevisionId
        - title
        - audience
        - goal
        - targetSlideCount
        - language
        - contentDepth
        - visualPreference
        - notes
        - sourceRefs
    OutlineSpec:
      title: OutlineSpec
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        outlineRevisionId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        storySummary:
          type: string
          minLength: 1
        targetSlideCount:
          type: integer
          minimum: 4
          maximum: 30
        slides:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            additionalProperties: false
            required:
              - outlineSlideId
              - type
              - title
              - keyPoints
              - sourceCitations
            properties:
              outlineSlideId:
                type: string
                pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
              type:
                type: string
                minLength: 1
              title:
                type: string
                minLength: 1
              keyPoints:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
              sourceCitations:
                type: array
                items:
                  type: string
                  pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
                uniqueItems: true
      required:
        - schemaVersion
        - outlineRevisionId
        - storySummary
        - targetSlideCount
        - slides
    ThemeSpec:
      title: ThemeSpec
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        themeId:
          type: string
          minLength: 1
        colorTokens:
          type: object
          additionalProperties:
            type: string
            pattern: ^#[0-9A-Fa-f]{6}$
          minProperties: 2
        fontFamilies:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        aspectRatio:
          enum:
            - 16:9
      required:
        - schemaVersion
        - themeId
        - colorTokens
        - fontFamilies
        - aspectRatio
    TemplateBinding:
      title: TemplateBinding
