        schemaVersion:
          type: integer
          const: 1
        templateId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        templateVersionId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        compatibilityVersion:
          type: string
          minLength: 1
        roleBindings:
          type: object
          additionalProperties:
            type: string
            minLength: 1
      required:
        - schemaVersion
