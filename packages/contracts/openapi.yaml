        snapshotId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        organizationId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        draftId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        intentRevisionId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        outlineRevisionId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        templateVersionId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        modeId:
          const: native
        sourceHashes:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{64}$
          uniqueItems: true
        promptVersion:
          type: string
          minLength: 1
        engineVersion:
          type: string
          minLength: 1
        containerVersion:
          type: string
          minLength: 1
        fontPackVersion:
          type: string
          minLength: 1
        providerConfigVersion:
          type: string
          minLength: 1
        snapshotSha256:
