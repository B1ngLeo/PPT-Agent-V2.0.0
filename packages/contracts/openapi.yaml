        schemaVersion:
          type: integer
          const: 1
        slideId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        outlineSlideId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        order:
          type: integer
          minimum: 0
        role:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        body:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        editable:
          type: boolean
      required:
        - schemaVersion
        - slideId
        - outlineSlideId
        - order
        - role
        - title
        - body
        - editable
    DeckPlan:
      title: DeckPlan
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        snapshotId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        title:
          type: string
          minLength: 1
        modeId:
          const: native
        templateBinding:
          $ref: "#/components/schemas/TemplateBinding"
        slides:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/SlidePlan"
      required:
        - schemaVersion
        - snapshotId
        - title
        - modeId
        - templateBinding
        - slides
    JobEvent:
      title: JobEvent
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        eventId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        jobId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        seq:
          type: integer
          minimum: 1
        type:
          enum:
            - job.queued
            - job.started
            - job.stage.changed
            - job.cancel.requested
            - job.cancelled
            - job.completed
            - job.partially_completed
            - job.failed
            - slide.started
            - slide.stage.changed
            - slide.ready
            - slide.failed
            - slide.retrying
            - qa.completed
            - artifact.published
        occurredAt:
          type: string
          format: date-time
        snapshotId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        slideId:
          anyOf:
            - type: string
              pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
            - type: "null"
        attempt:
          type: integer
          minimum: 0
        stage:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
        progress:
          type: object
          additionalProperties: false
          required:
            - completed
            - total
          properties:
            completed:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        data:
          type: object
          additionalProperties: true
        traceId:
          type: string
          minLength: 1
      required:
        - schemaVersion
        - eventId
        - jobId
        - seq
        - type
        - occurredAt
        - snapshotId
        - slideId
        - attempt
        - stage
        - status
        - progress
        - data
        - traceId
    SseReset:
      title: SseReset
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        jobId:
          type: string
          pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        reason:
          enum:
            - retention_window_exceeded
            - sequence_unavailable
        snapshotUrl:
          type: string
          pattern: ^/v1/jobs/
        latestSeq:
          type: integer
          minimum: 0
      required:
        - schemaVersion
        - jobId
        - reason
        - snapshotUrl
        - latestSeq
