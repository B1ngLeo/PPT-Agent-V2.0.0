packages:
  - apps/*
  - packages/*

registries:
  default: https://registry.npmmirror.com

fetchTimeout: 600000
fetchRetries: 5
fetchRetryMintimeout: 10000
fetchRetryMaxtimeout: 120000
networkConcurrency: 4
preferOffline: true
strictPeerDependencies: true
strictDepBuilds: true

allowBuilds:
  sharp@0.34.5: true
