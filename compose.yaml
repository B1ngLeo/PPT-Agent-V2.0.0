name: instant-ppt

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instant_ppt}
      POSTGRES_USER: ${POSTGRES_USER:-instant_ppt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-instant-ppt-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4.2
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  api:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: &runtime-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-instant_ppt}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-instant_ppt}
      REDIS_EVENTS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-20}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-0.25}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-30}
    command:
      - instant_ppt_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment: *runtime-environment
    entrypoint: ["celery"]
    command:
      - -A
      - instant_ppt_worker.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --without-gossip
      - --without-mingle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  outbox:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment: *runtime-environment
    entrypoint: ["python", "-m", "instant_ppt_worker.outbox_runner"]
    command: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
