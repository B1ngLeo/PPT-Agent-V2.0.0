name: instant-ppt

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instant_ppt}
      POSTGRES_USER: ${POSTGRES_USER:-instant_ppt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-instant-ppt-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clamav:
    image: instant-ppt-clamav:1.4.3-bookworm
    build:
      context: .
      dockerfile: services/clamav/Dockerfile
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/clamd-health.py"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/clamav:rw,noexec,nosuid,size=8m
    restart: unless-stopped

  api:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment: &runtime-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-instant_ppt}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-instant_ppt}
      REDIS_EVENTS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-20}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-0.25}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-30}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      AUTH_MODE: ${AUTH_MODE:-local}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ALGORITHMS: ${OIDC_ALGORITHMS:-RS256}
      OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-30}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-900}
      UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-600}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-instant-ppt-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-development-only}
      S3_BUCKET: ${S3_BUCKET:-instant-ppt-private}
    command:
      - instant_ppt_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      <<: *runtime-environment
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k3}
      KIMI_REASONING_EFFORT: ${KIMI_REASONING_EFFORT:-max}
      KIMI_TIMEOUT_SECONDS: ${KIMI_TIMEOUT_SECONDS:-120}
      IMAGE_BACKEND: ${IMAGE_BACKEND:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-image-2}
      OPENAI_OUTPUT_FORMAT: ${OPENAI_OUTPUT_FORMAT:-png}
      OPENAI_IMAGE_TIMEOUT_SECONDS: ${OPENAI_IMAGE_TIMEOUT_SECONDS:-300}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
    entrypoint: ["celery"]
    command:
      - -A
      - instant_ppt_worker.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --without-gossip
      - --without-mingle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /workspace:rw,noexec,nosuid,size=64m
    restart: unless-stopped

  outbox:
    profiles: ["runtime"]
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment: *runtime-environment
    entrypoint: ["python", "-m", "instant_ppt_worker.outbox_runner"]
    command: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
