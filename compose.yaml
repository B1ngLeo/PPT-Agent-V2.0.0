name: instant-ppt

x-worker-runtime: &worker-runtime
  image: instant-ppt-runtime:${APP_BUILD_REVISION:-dev-uncommitted}
  build:
    context: .
    dockerfile: services/worker/Dockerfile
    args:
      APP_BUILD_REVISION: ${APP_BUILD_REVISION:-dev-uncommitted}
      RUNTIME_CONTRACT_VERSION: ${RUNTIME_CONTRACT_VERSION:-instant-ppt-runtime@v2}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instant_ppt}
      POSTGRES_USER: ${POSTGRES_USER:-instant_ppt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-instant-ppt-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000}
      # Local verification only. Production must replace the static key with KES/KMS.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-instant-ppt-local:aW5zdGFudC1wcHQtbG9jYWwtc3NlLWtleS0zMmJ5dGU=}
      MINIO_API_STALE_UPLOADS_EXPIRY: ${MINIO_API_STALE_UPLOADS_EXPIRY:-24h}
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: ${MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL:-1h}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clamav:
    image: instant-ppt-clamav:1.4.3-bookworm
    build:
      context: .
      dockerfile: services/clamav/Dockerfile
    ports:
      - "127.0.0.1:3310:3310"
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/clamd-health.py"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/clamav:rw,noexec,nosuid,size=8m
    restart: unless-stopped

  api:
    profiles: ["runtime"]
    image: instant-ppt-api:${APP_BUILD_REVISION:-dev-uncommitted}
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args:
        APP_BUILD_REVISION: ${APP_BUILD_REVISION:-dev-uncommitted}
        RUNTIME_CONTRACT_VERSION: ${RUNTIME_CONTRACT_VERSION:-instant-ppt-runtime@v2}
    environment: &runtime-environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-instant_ppt}:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/${POSTGRES_DB:-instant_ppt}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      REDIS_EVENTS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-20}
      OUTBOX_POLL_SECONDS: ${OUTBOX_POLL_SECONDS:-0.25}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-30}
      CELERY_VISIBILITY_TIMEOUT_SECONDS: ${CELERY_VISIBILITY_TIMEOUT_SECONDS:-4500}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AUTH_MODE: ${AUTH_MODE:-local}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ALGORITHMS: ${OIDC_ALGORITHMS:-RS256}
      OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-30}
      DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-900}
      UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-600}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PLANNING_BACKEND: ${PLANNING_BACKEND:-fake}
      PROVIDER_GATEWAY_URL: http://provider-gateway:8090/internal/v1
      PROVIDER_GATEWAY_TOKEN: ${PROVIDER_GATEWAY_TOKEN:-local-development-provider-gateway-only}
      PROVIDER_GATEWAY_TIMEOUT_SECONDS: ${PROVIDER_GATEWAY_TIMEOUT_SECONDS:-600}
      PROVIDER_CONFIG_VERSION: ${PROVIDER_CONFIG_VERSION:-deterministic-fake-v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k3}
      IMAGE_BACKEND: ${IMAGE_BACKEND:-openai}
      IMAGE_GENERATION_ENABLED: ${IMAGE_GENERATION_ENABLED:-false}
      IMAGE_MAX_PER_DECK: ${IMAGE_MAX_PER_DECK:-0}
      APP_BUILD_REVISION: ${APP_BUILD_REVISION:-dev-uncommitted}
      RUNTIME_CONTRACT_VERSION: ${RUNTIME_CONTRACT_VERSION:-instant-ppt-runtime@v2}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-image-2}
      OPENAI_OUTPUT_FORMAT: ${OPENAI_OUTPUT_FORMAT:-png}
      OPENAI_IMAGE_SIZE: ${OPENAI_IMAGE_SIZE:-1536x1024}
      OPENAI_IMAGE_QUALITY: ${OPENAI_IMAGE_QUALITY:-low}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-instant-ppt-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-development-only}
      S3_BUCKET: ${S3_BUCKET:-instant-ppt-private}
    command:
      - instant_ppt_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "4"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      provider-gateway:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped

  worker:
    profiles: ["runtime"]
    <<: *worker-runtime
    environment:
      <<: *runtime-environment
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_PROTOCOL: ${KIMI_PROTOCOL:-openai}
      KIMI_REASONING_EFFORT: ${KIMI_REASONING_EFFORT:-max}
      KIMI_TIMEOUT_SECONDS: ${KIMI_TIMEOUT_SECONDS:-240}
      OPENAI_IMAGE_TIMEOUT_SECONDS: ${OPENAI_IMAGE_TIMEOUT_SECONDS:-300}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
    entrypoint: ["celery"]
    command:
      - -A
      - instant_ppt_worker.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --without-gossip
      - --without-mingle
      - -Q
      - default
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /workspace:rw,noexec,nosuid,size=64m
    restart: unless-stopped

  agent-worker:
    profiles: ["runtime"]
    <<: *worker-runtime
    environment:
      <<: *runtime-environment
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_PROTOCOL: ${KIMI_PROTOCOL:-openai}
      KIMI_REASONING_EFFORT: ${KIMI_REASONING_EFFORT:-max}
      KIMI_TIMEOUT_SECONDS: ${KIMI_TIMEOUT_SECONDS:-240}
      OPENAI_IMAGE_TIMEOUT_SECONDS: ${OPENAI_IMAGE_TIMEOUT_SECONDS:-300}
    entrypoint: ["celery"]
    command:
      - -A
      - instant_ppt_worker.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --without-gossip
      - --without-mingle
      - -Q
      - agentic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 3g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /workspace:rw,noexec,nosuid,size=128m
    restart: unless-stopped

  provider-gateway:
    profiles: ["runtime"]
    <<: *worker-runtime
    environment:
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k3}
      KIMI_PROTOCOL: ${KIMI_PROTOCOL:-openai}
      KIMI_REASONING_EFFORT: ${KIMI_REASONING_EFFORT:-max}
      KIMI_TIMEOUT_SECONDS: ${KIMI_TIMEOUT_SECONDS:-240}
      KIMI_TRANSPORT_MAX_RETRIES: ${KIMI_TRANSPORT_MAX_RETRIES:-1}
      KIMI_RETRY_BACKOFF_SECONDS: ${KIMI_RETRY_BACKOFF_SECONDS:-2}
      KIMI_INTENT_MAX_COMPLETION_TOKENS: ${KIMI_INTENT_MAX_COMPLETION_TOKENS:-1600}
      KIMI_OUTLINE_MAX_COMPLETION_TOKENS: ${KIMI_OUTLINE_MAX_COMPLETION_TOKENS:-2600}
      PROVIDER_GATEWAY_TOKEN: ${PROVIDER_GATEWAY_TOKEN:-local-development-provider-gateway-only}
      PROVIDER_GATEWAY_HOST: 0.0.0.0
      PROVIDER_GATEWAY_PORT: "8090"
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      APP_BUILD_REVISION: ${APP_BUILD_REVISION:-dev-uncommitted}
      RUNTIME_CONTRACT_VERSION: ${RUNTIME_CONTRACT_VERSION:-instant-ppt-runtime@v2}
    entrypoint: ["python", "-m", "instant_ppt_worker.provider_gateway"]
    command: []
    expose: ["8090"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /workspace:rw,noexec,nosuid,size=32m
    restart: unless-stopped

  outbox:
    profiles: ["runtime"]
    <<: *worker-runtime
    environment: *runtime-environment
    entrypoint: ["python", "-m", "instant_ppt_worker.outbox_runner"]
    command: []
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
