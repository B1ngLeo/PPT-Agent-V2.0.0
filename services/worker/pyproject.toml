[project]
name = "instant-ppt-worker"
version = "0.0.0"
requires-python = ">=3.12.4,<3.13"
dependencies = [
  "beautifulsoup4==4.15.0",
  "celery==5.6.3",
  "defusedxml==0.7.1",
  "mammoth==1.12.1",
  "markdownify==1.2.3",
  "numpy==2.5.2",
  "pillow==12.3.0",
  "pydantic==2.13.4",
  "pypdf==6.16.1",
  "python-pptx==1.0.2",
  "skia-pathops==0.9.2",
  "uharfbuzz==0.56.0",
  "xlsxwriter==3.2.9",
]

[project.scripts]
engine-adapter = "instant_ppt_worker.adapter:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/instant_ppt_worker"]
