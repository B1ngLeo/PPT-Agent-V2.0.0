[project]
name = "instant-ppt-workspace"
version = "2.1.0"
requires-python = ">=3.12.4,<3.13"
dependencies = [
  "instant-ppt-api",
  "instant-ppt-domain",
  "instant-ppt-worker",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.uv.sources]
instant-ppt-api = { workspace = true }
instant-ppt-domain = { workspace = true }
instant-ppt-worker = { workspace = true }

[tool.uv.workspace]
members = ["packages/domain", "services/api", "services/worker"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["packages/domain/tests", "services/api/tests", "services/worker/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
