<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>即刻AI-PPT · 首页原型提案 V2</title>
    <!--
      Prototype assumptions
      - Reference: the user-provided WPS AIPPT home screenshot.
      - Product context: existing Instant PPT home flow, immutable templates, native editable decks.
      - Direction: chat-first creation surface, compact task shortcuts, filterable template gallery.
      - Scope: design-only prototype. No production source is imported or modified.
    -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <style>
      :root {
        --canvas: #f4f1e9;
        --surface: #fffef9;
        --surface-muted: #ebe8df;
        --ink: #17221d;
        --ink-soft: #4e5c55;
        --muted: #7a857e;
        --line: rgba(23, 34, 29, 0.13);
        --line-strong: rgba(23, 34, 29, 0.2);
        --accent: #1746d1;
        --accent-deep: #1038b4;
        --accent-soft: #e9edff;
        --violet: #1746d1;
        --orange: #f2764d;
        --success: #1e6b4d;
        --shadow: 0 18px 46px rgba(23, 34, 29, 0.09);
        --shadow-soft: 0 5px 18px rgba(23, 34, 29, 0.05);
        --radius-large: 24px;
        --radius-medium: 16px;
        --page-width: 1180px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--canvas);
      }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--canvas);
        font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button,
      textarea,
      input {
        font: inherit;
      }

      button {
        color: inherit;
      }

      button:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 3px solid rgba(74, 67, 232, 0.2);
        outline-offset: 2px;
      }

      .app {
        min-height: 100vh;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 0 max(24px, calc((100vw - var(--page-width)) / 2));
        border-bottom: 1px solid rgba(23, 34, 29, 0.1);
        background: rgba(244, 241, 233, 0.9);
        backdrop-filter: blur(20px);
      }

      .brand,
      .top-actions,
      .top-button,
      .account,
      .composer-toolbar,
      .toolbar-left,
      .mode-switch,
      .section-title-row,
      .category-row,
      .template-meta,
      .history-item-top,
      .dialog-actions {
        display: flex;
        align-items: center;
      }

      .brand {
        gap: 10px;
        border: 0;
        padding: 0;
        background: transparent;
        font-size: 16px;
        font-weight: 760;
        letter-spacing: -0.02em;
        cursor: pointer;
      }

      .brand-mark {
        position: relative;
        width: 29px;
        height: 29px;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 9px 9px 9px 3px;
        color: #d6ef70;
        background: var(--ink);
        font-size: 14px;
        font-weight: 840;
        box-shadow: 0 5px 14px rgba(23, 34, 29, 0.18);
      }

      .brand-mark::after {
        content: "";
        position: absolute;
        right: -5px;
        bottom: -7px;
        width: 18px;
        height: 18px;
        border: 4px solid rgba(255, 255, 255, 0.72);
        border-radius: 50%;
      }

      .brand span:last-child strong {
        color: var(--accent);
      }

      .top-actions {
        gap: 8px;
      }

      .top-button {
        min-height: 42px;
        gap: 8px;
        border: 0;
        border-radius: 12px;
        padding: 0 12px;
        background: transparent;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }

      .top-button:hover {
        background: rgba(255, 255, 255, 0.8);
      }

      .tiny-icon {
        width: 18px;
        height: 18px;
        display: grid;
        place-items: center;
        border: 1.5px solid currentColor;
        border-radius: 5px;
        font-size: 10px;
        line-height: 1;
      }

      .quota {
        min-height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e0e3ec;
        border-radius: 999px;
        padding: 0 13px;
        color: #343849;
        background: rgba(255, 255, 255, 0.78);
        font-size: 12px;
        font-weight: 690;
      }

      .quota-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #71b82b;
        box-shadow: 0 0 0 4px rgba(113, 184, 43, 0.1);
      }

      .account {
        width: 36px;
        height: 36px;
        justify-content: center;
        border: 2px solid white;
        border-radius: 50%;
        color: var(--accent-deep);
        background: #e9e8ff;
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 2px 8px rgba(31, 32, 52, 0.12);
        cursor: pointer;
      }

      main {
        width: min(var(--page-width), calc(100% - 40px));
        margin: 0 auto;
        padding: 52px 0 72px;
      }

      .hero {
        max-width: 870px;
        margin: 0 auto;
        text-align: center;
      }

      .hero h1 {
        margin: 0;
        font-family: Georgia, "Songti SC", "Noto Serif SC", serif;
        font-size: clamp(42px, 5.4vw, 66px);
        font-weight: 500;
        letter-spacing: -0.055em;
        line-height: 1.08;
      }

      .hero h1 .accent-text {
        color: var(--accent);
      }

      .composer {
        position: relative;
        margin-top: 36px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-large);
        border-left: 4px solid var(--accent);
        background: rgba(255, 254, 249, 0.97);
        box-shadow: var(--shadow);
        text-align: left;
        transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
      }

      .composer.focused {
        border-color: rgba(74, 67, 232, 0.46);
        box-shadow: 0 18px 52px rgba(47, 42, 152, 0.13);
      }

      .composer.has-error {
        animation: nudge 240ms ease;
        border-color: #dc6a60;
      }

      @keyframes nudge {
        0%, 100% { transform: translateX(0); }
        35% { transform: translateX(-5px); }
        70% { transform: translateX(5px); }
      }

      .composer textarea {
        width: 100%;
        min-height: 116px;
        display: block;
        resize: none;
        border: 0;
        padding: 22px 24px 8px;
        color: var(--ink);
        background: transparent;
        font-size: 16px;
        line-height: 1.65;
      }

      .composer textarea::placeholder {
        color: #9da2b0;
      }

      .composer textarea:focus {
        outline: 0;
      }

      .file-chip {
        width: fit-content;
        max-width: calc(100% - 48px);
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0 24px 8px;
        border: 1px solid #dfe1ff;
        border-radius: 10px;
        padding: 8px 10px;
        color: var(--accent-deep);
        background: var(--accent-soft);
        font-size: 12px;
        font-weight: 700;
      }

      .file-chip button {
        border: 0;
        padding: 0;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
      }

      .composer-toolbar {
        justify-content: space-between;
        gap: 16px;
        padding: 12px 14px 14px;
      }

      .toolbar-left {
        min-width: 0;
        gap: 10px;
      }

      .upload-button,
      .mode-switch button,
      .primary-action,
      .quick-card,
      .category-button,
      .template-card,
      .more-button,
      .icon-only,
      .secondary-action {
        border: 0;
        cursor: pointer;
      }

      .upload-button {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 0 13px;
        background: white;
        font-size: 13px;
        font-weight: 680;
      }

      .upload-button:hover {
        border-color: #cfd2dd;
        background: #fafbfe;
      }

      .mode-switch {
        min-width: 0;
        gap: 2px;
        border-radius: 11px;
        padding: 3px;
        background: var(--surface-muted);
      }

      .mode-switch button {
        min-height: 34px;
        border-radius: 9px;
        padding: 0 12px;
        color: #747988;
        background: transparent;
        font-size: 12px;
        font-weight: 680;
        white-space: nowrap;
      }

      .mode-switch button.active {
        color: var(--ink);
        background: white;
        box-shadow: 0 2px 8px rgba(31, 34, 50, 0.08);
      }

      .primary-action {
        min-height: 42px;
        flex: 0 0 auto;
        border-radius: 13px;
        padding: 0 20px;
        color: white;
        background: var(--accent);
        font-size: 13px;
        font-weight: 760;
        box-shadow: 0 8px 18px rgba(23, 70, 209, 0.2);
        transition: transform 140ms ease, background 140ms ease;
      }

      .primary-action:hover {
        transform: translateY(-1px);
        background: var(--accent-deep);
      }

      .form-error {
        margin: -4px 24px 10px;
        color: #bd473e;
        font-size: 12px;
        font-weight: 650;
      }

      .quick-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 14px;
      }

      .quick-card {
        min-height: 78px;
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 11px;
        border: 1px solid var(--line);
        border-radius: var(--radius-medium);
        padding: 13px;
        background: rgba(255, 255, 255, 0.78);
        text-align: left;
        box-shadow: var(--shadow-soft);
        transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
      }

      .quick-card:hover {
        transform: translateY(-2px);
        border-color: #d6d2ff;
        background: white;
      }

      .quick-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        font-size: 10px;
        font-weight: 860;
        letter-spacing: -0.02em;
      }

      .quick-icon.doc {
        color: #d65528;
        background: #fff0e8;
      }

      .quick-icon.ai {
        color: #7925d0;
        background: #f4eaff;
      }

      .quick-icon.idea {
        color: #2c66cf;
        background: #e9f1ff;
      }

      .quick-copy {
        min-width: 0;
      }

      .quick-copy strong,
      .quick-copy small {
        display: block;
      }

      .quick-copy strong {
        margin-top: 1px;
        font-size: 13px;
      }

      .quick-copy small {
        overflow: hidden;
        margin-top: 5px;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .templates {
        margin-top: 64px;
      }

      .section-title-row {
        justify-content: space-between;
        gap: 24px;
      }

      .section-title-row h2 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.025em;
      }

      .section-title-row p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .upload-template {
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 0;
        border-radius: 11px;
        padding: 0 12px;
        color: var(--ink-soft);
        background: transparent;
        font-size: 12px;
        font-weight: 680;
        cursor: pointer;
      }

      .upload-template:hover {
        background: white;
      }

      .category-scroll {
        margin-top: 20px;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .category-scroll::-webkit-scrollbar {
        display: none;
      }

      .category-row {
        width: max-content;
        gap: 5px;
      }

      .category-button {
        min-height: 34px;
        border-radius: 9px;
        padding: 0 12px;
        color: #707583;
        background: transparent;
        font-size: 12px;
        white-space: nowrap;
      }

      .category-button.active {
        color: var(--ink);
        background: white;
        font-weight: 760;
        box-shadow: 0 3px 12px rgba(26, 30, 47, 0.06);
      }

      .template-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-top: 16px;
      }

      .template-card {
        position: relative;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 17px;
        padding: 7px 7px 13px;
        background: rgba(255, 255, 255, 0.84);
        text-align: left;
        box-shadow: 0 5px 16px rgba(30, 33, 52, 0.035);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }

      .template-card:hover {
        transform: translateY(-3px);
        border-color: rgba(23, 70, 209, 0.34);
        box-shadow: 0 12px 28px rgba(23, 34, 29, 0.09);
      }

      .template-card.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(23, 70, 209, 0.1), 0 12px 28px rgba(23, 34, 29, 0.09);
      }

      .template-card.selected::after {
        content: "已选择";
        position: absolute;
        top: 13px;
        right: 13px;
        border-radius: 999px;
        padding: 5px 8px;
        color: white;
        background: var(--accent);
        font-size: 10px;
        font-weight: 780;
        box-shadow: 0 4px 12px rgba(23, 70, 209, 0.24);
      }

      .slide-preview {
        position: relative;
        width: 100%;
        display: block;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 12px;
        isolation: isolate;
      }

      .slide-preview .mini-kicker,
      .slide-preview .mini-title,
      .slide-preview .mini-copy,
      .slide-preview .mini-panel,
      .slide-preview .mini-chart,
      .slide-preview .mini-orb {
        position: absolute;
        display: block;
      }

      .slide-preview .mini-kicker {
        left: 9%;
        top: 13%;
        width: 25%;
        height: 4%;
        border-radius: 99px;
      }

      .slide-preview .mini-title {
        left: 9%;
        top: 27%;
        width: 51%;
        height: 9%;
        border-radius: 3px;
      }

      .slide-preview .mini-copy {
        left: 9%;
        top: 43%;
        width: 38%;
        height: 4%;
        border-radius: 99px;
        box-shadow: 0 10px 0 currentColor, 0 20px 0 currentColor;
        opacity: 0.45;
      }

      .slide-preview .mini-panel {
        right: 7%;
        top: 11%;
        width: 37%;
        height: 74%;
        border-radius: 10px;
      }

      .slide-preview .mini-chart {
        right: 12%;
        bottom: 20%;
        width: 26%;
        height: 37%;
        border-left: 12px solid currentColor;
        border-right: 18px solid currentColor;
        box-shadow: 14px 0 0 currentColor;
        opacity: 0.72;
      }

      .slide-preview .mini-orb {
        right: 12%;
        top: 21%;
        width: 23%;
        aspect-ratio: 1;
        border-radius: 50%;
      }

      .slide-preview.signal {
        color: #1468d4;
        background: #e9f4ff;
      }

      .slide-preview.signal .mini-kicker,
      .slide-preview.signal .mini-title { background: #126bdd; }
      .slide-preview.signal .mini-panel { background: #56b9ff; transform: rotate(-5deg); }
      .slide-preview.signal .mini-orb { background: rgba(255, 255, 255, 0.74); box-shadow: 0 0 0 14px rgba(20, 104, 212, 0.12); }

      .slide-preview.pulse {
        color: #8e220d;
        background: #fa4a22;
      }

      .slide-preview.pulse::before {
        content: "";
        position: absolute;
        inset: auto -12% -33% 20%;
        height: 80%;
        border-radius: 50%;
        background: #ff9d28;
        filter: blur(3px);
      }

      .slide-preview.pulse .mini-kicker { background: rgba(255, 255, 255, 0.75); }
      .slide-preview.pulse .mini-title { width: 58%; background: white; }
      .slide-preview.pulse .mini-copy { color: rgba(255, 255, 255, 0.75); }
      .slide-preview.pulse .mini-panel { background: rgba(255, 255, 255, 0.19); border: 1px solid rgba(255, 255, 255, 0.4); }

      .slide-preview.night {
        color: #d69833;
        background: #17120d;
      }

      .slide-preview.night::before {
        content: "";
        position: absolute;
        inset: -35% -15% -20% 40%;
        border: 1px solid rgba(215, 157, 60, 0.48);
        border-radius: 50%;
        box-shadow: 0 0 0 13px rgba(215, 157, 60, 0.08), 0 0 0 29px rgba(215, 157, 60, 0.05);
      }

      .slide-preview.night .mini-kicker,
      .slide-preview.night .mini-title { background: #d6a24e; }
      .slide-preview.night .mini-copy { color: #d6a24e; }
      .slide-preview.night .mini-panel { background: rgba(214, 162, 78, 0.08); border: 1px solid rgba(214, 162, 78, 0.26); }

      .slide-preview.paper {
        color: #6852c9;
        background: #f1efff;
      }

      .slide-preview.paper::before,
      .slide-preview.paper::after {
        content: "";
        position: absolute;
        width: 2px;
        top: 0;
        bottom: 0;
        background: rgba(103, 81, 202, 0.28);
      }

      .slide-preview.paper::before { left: 28%; }
      .slide-preview.paper::after { right: 17%; }
      .slide-preview.paper .mini-kicker,
      .slide-preview.paper .mini-title { background: #5e47cc; }
      .slide-preview.paper .mini-copy { color: #6852c9; }
      .slide-preview.paper .mini-panel { background: #161b38; box-shadow: -10px 11px 0 rgba(104, 82, 201, 0.16); }

      .slide-preview.mint {
        color: #087c72;
        background: #eafaf6;
      }

      .slide-preview.mint .mini-kicker,
      .slide-preview.mint .mini-title { background: #087c72; }
      .slide-preview.mint .mini-copy { color: #087c72; }
      .slide-preview.mint .mini-panel { background: #a9e4d8; }
      .slide-preview.mint .mini-orb { background: #fff; box-shadow: 0 0 0 12px rgba(8, 124, 114, 0.12); }

      .slide-preview.slate {
        color: #2f5c8e;
        background: #edf3fa;
      }

      .slide-preview.slate .mini-kicker,
      .slide-preview.slate .mini-title { background: #173e70; }
      .slide-preview.slate .mini-copy { color: #2f5c8e; }
      .slide-preview.slate .mini-panel { background: #173e70; transform: skewX(-5deg); }
      .slide-preview.slate .mini-chart { color: #5d9ee6; }

      .template-name {
        display: block;
        overflow: hidden;
        padding: 12px 7px 0;
        font-size: 13px;
        font-weight: 730;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .template-meta {
        justify-content: space-between;
        gap: 10px;
        padding: 6px 7px 0;
        color: var(--muted);
        font-size: 10px;
      }

      .template-meta span:last-child {
        color: var(--accent);
        font-weight: 700;
      }

      .more-wrap {
        display: flex;
        justify-content: center;
        margin-top: 24px;
      }

      .more-button,
      .secondary-action {
        min-height: 42px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        padding: 0 16px;
        background: white;
        font-size: 12px;
        font-weight: 720;
      }

      .more-button:hover,
      .secondary-action:hover {
        border-color: #cac5ff;
      }

      .prototype-badge {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 16;
        border: 1px solid rgba(23, 70, 209, 0.2);
        border-radius: 999px;
        padding: 8px 11px;
        color: var(--accent-deep);
        background: rgba(233, 237, 255, 0.92);
        backdrop-filter: blur(12px);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        box-shadow: 0 6px 18px rgba(23, 34, 29, 0.08);
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(18, 20, 31, 0.3);
        backdrop-filter: blur(5px);
        animation: fade-in 160ms ease;
      }

      @keyframes fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .history-drawer {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: min(430px, 92vw);
        padding: 24px;
        background: white;
        box-shadow: -18px 0 48px rgba(17, 19, 29, 0.14);
        animation: slide-in 220ms ease;
      }

      @keyframes slide-in {
        from { transform: translateX(100%); }
        to { transform: translateX(0); }
      }

      .drawer-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }

      .drawer-head h2 {
        margin: 0;
        font-size: 22px;
      }

      .drawer-head p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
      }

      .icon-only {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 11px;
        background: var(--surface-muted);
        font-size: 18px;
      }

      .history-list {
        display: grid;
        gap: 10px;
        margin-top: 24px;
      }

      .history-item {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 15px;
        background: #fbfbfd;
      }

      .history-item-top {
        justify-content: space-between;
        gap: 16px;
      }

      .history-item strong {
        font-size: 13px;
      }

      .history-item span {
        border-radius: 999px;
        padding: 4px 7px;
        color: var(--success);
        background: #e8f8f1;
        font-size: 10px;
        font-weight: 750;
      }

      .history-item p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 11px;
      }

      .dialog-shell {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .dialog {
        width: min(470px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 22px;
        padding: 26px;
        background: white;
        box-shadow: 0 26px 72px rgba(17, 19, 31, 0.22);
        animation: dialog-in 180ms ease;
      }

      @keyframes dialog-in {
        from { transform: translateY(8px) scale(0.985); opacity: 0; }
        to { transform: translateY(0) scale(1); opacity: 1; }
      }

      .dialog-mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        color: white;
        background: var(--accent);
        font-weight: 850;
      }

      .dialog h2 {
        margin: 18px 0 0;
        font-size: 22px;
      }

      .dialog > p {
        margin: 9px 0 0;
        color: var(--ink-soft);
        font-size: 13px;
        line-height: 1.7;
      }

      .summary-card {
        display: grid;
        gap: 9px;
        margin-top: 18px;
        border-radius: 14px;
        padding: 14px;
        background: var(--surface-muted);
      }

      .summary-row {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 12px;
        font-size: 12px;
      }

      .summary-row span {
        color: var(--muted);
      }

      .summary-row strong {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .dialog-actions {
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }

      .dialog-actions .primary-action {
        min-height: 42px;
      }

      @media (max-width: 980px) {
        .template-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .quota {
          display: none;
        }
      }

      @media (max-width: 760px) {
        .topbar {
          min-height: 62px;
          padding-inline: 16px;
        }

        .top-button.create-mode {
          display: none;
        }

        .top-button {
          padding-inline: 8px;
        }

        .top-button .button-label {
          display: none;
        }

        main {
          width: min(100% - 24px, var(--page-width));
          padding-top: 34px;
        }

        .hero h1 {
          font-size: 34px;
        }

        .hero-subtitle {
          font-size: 14px;
        }

        .composer textarea {
          min-height: 128px;
          padding-inline: 18px;
        }

        .composer-toolbar {
          align-items: stretch;
          flex-direction: column;
        }

        .toolbar-left {
          justify-content: space-between;
        }

        .primary-action {
          width: 100%;
        }

        .quick-grid {
          grid-template-columns: 1fr;
        }

        .template-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 10px;
        }

        .section-title-row {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }

        .upload-template {
          padding-left: 0;
        }

        .prototype-badge {
          display: none;
        }
      }

      @media (max-width: 470px) {
        .brand span:last-child {
          font-size: 14px;
        }

        .hero h1 {
          font-size: 30px;
        }

        .mode-switch button {
          padding-inline: 8px;
          font-size: 11px;
        }

        .template-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useMemo, useRef, useState } = React;

      const homepageTemplates = [
        { id: "signal", name: "AI 人工智能项目计划", category: "精品推荐", tone: "signal", meta: "18 页 · 原生图表" },
        { id: "pulse", name: "年度征程主题汇报", category: "总结汇报", tone: "pulse", meta: "16 页 · 高管汇报" },
        { id: "night", name: "年度业绩回顾与展望", category: "总结汇报", tone: "night", meta: "20 页 · 强对比" },
        { id: "paper", name: "病例统计分析报告", category: "医疗健康", tone: "paper", meta: "14 页 · 数据叙事" },
        { id: "mint", name: "数研教学学期总结", category: "教育培训", tone: "mint", meta: "18 页 · 知识讲解" },
        { id: "slate", name: "经营分析与行动复盘", category: "企业宣讲", tone: "slate", meta: "16 页 · 编辑友好" },
        { id: "signal-2", name: "招聘人才总结汇报", category: "人资行政", tone: "signal", meta: "12 页 · 图文混排" },
        { id: "paper-2", name: "产品营销增长提案", category: "营销推广", tone: "paper", meta: "15 页 · 视觉创意" },
        { id: "mint-2", name: "新品发布路演提案", category: "企业宣讲", tone: "mint", meta: "14 页 · 品牌叙事" },
        { id: "night-2", name: "商业计划与融资路演", category: "商业计划", tone: "night", meta: "18 页 · 投资人视角" },
        { id: "pulse-2", name: "营销战役复盘报告", category: "营销推广", tone: "pulse", meta: "16 页 · 增长提案" },
        { id: "slate-2", name: "临床研究阶段汇报", category: "医疗健康", tone: "slate", meta: "20 页 · 专业报告" },
      ];

      const homepageCategories = ["精品推荐", "总结汇报", "教育培训", "营销推广", "企业宣讲", "商业计划", "人资行政", "医疗健康"];

      const historyItems = [
        { title: "2027 年产品增长策略", status: "已完成", meta: "18 页 · 自由设计 · 今天 10:26" },
        { title: "二季度经营复盘与行动计划", status: "已完成", meta: "16 页 · 经营信号 · 昨天 18:42" },
        { title: "工业园区零碳解决方案", status: "草稿", meta: "大纲 9 页 · 8 月 28 日" },
      ];

      function SlidePreview({ tone }) {
        return (
          <span className={`slide-preview ${tone}`} aria-hidden="true">
            <i className="mini-kicker"></i>
            <i className="mini-title"></i>
            <i className="mini-copy"></i>
            <i className="mini-panel"></i>
            <i className="mini-chart"></i>
            <i className="mini-orb"></i>
          </span>
        );
      }

      function HistoryDrawer({ onClose }) {
        return (
          <div className="overlay" role="presentation" onMouseDown={(event) => event.target === event.currentTarget && onClose()}>
            <aside className="history-drawer" aria-label="历史创作">
              <div className="drawer-head">
                <div>
                  <h2>历史创作</h2>
                  <p>草稿、生成任务与已发布版本统一保留。</p>
                </div>
                <button className="icon-only" type="button" onClick={onClose} aria-label="关闭历史创作">×</button>
              </div>
              <div className="history-list">
                {historyItems.map((item) => (
                  <article className="history-item" key={item.title}>
                    <div className="history-item-top">
                      <strong>{item.title}</strong>
                      <span>{item.status}</span>
                    </div>
                    <p>{item.meta}</p>
                  </article>
                ))}
              </div>
            </aside>
          </div>
        );
      }

      function GenerateDialog({ topic, mode, template, fileName, onClose }) {
        return (
          <div className="overlay" role="presentation" onMouseDown={(event) => event.target === event.currentTarget && onClose()}>
            <div className="dialog-shell">
              <section className="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
                <div className="dialog-mark">即</div>
                <h2 id="dialog-title">创作输入已准备好</h2>
                <p>这是首页交互原型。确认视觉方案后，正式页面会继续进入真实的意图识别与可编辑大纲流程。</p>
                <div className="summary-card">
                  <div className="summary-row"><span>创作主题</span><strong>{topic || fileName}</strong></div>
                  <div className="summary-row"><span>创作模式</span><strong>{mode}</strong></div>
                  <div className="summary-row"><span>叙事模板</span><strong>{template}</strong></div>
                </div>
                <div className="dialog-actions">
                  <button className="secondary-action" type="button" onClick={onClose}>返回调整</button>
                  <button className="primary-action" type="button" onClick={onClose}>了解，继续看原型</button>
                </div>
              </section>
            </div>
          </div>
        );
      }

      function App() {
        const [topic, setTopic] = useState("");
        const [mode, setMode] = useState("自由设计");
        const [fileName, setFileName] = useState("");
        const [focused, setFocused] = useState(false);
        const [formError, setFormError] = useState("");
        const [activeCategory, setActiveCategory] = useState("精品推荐");
        const [selectedTemplate, setSelectedTemplate] = useState("signal");
        const [showAll, setShowAll] = useState(false);
        const [historyOpen, setHistoryOpen] = useState(false);
        const [dialogOpen, setDialogOpen] = useState(false);
        const fileInput = useRef(null);

        const visibleTemplates = useMemo(() => {
          const filtered = activeCategory === "精品推荐"
            ? homepageTemplates
            : homepageTemplates.filter((template) => template.category === activeCategory);
          return showAll ? filtered : filtered.slice(0, 8);
        }, [activeCategory, showAll]);

        const selectedTemplateName = homepageTemplates.find((template) => template.id === selectedTemplate)?.name ?? "AI 人工智能项目计划";

        function generate() {
          if (!topic.trim() && !fileName) {
            setFormError("请先输入主题，或上传一份主文档。");
            window.setTimeout(() => setFormError(""), 2600);
            return;
          }
          setFormError("");
          setDialogOpen(true);
        }

        return (
          <div className="app" data-screen-label="首页原型 v2">
            <header className="topbar">
              <button className="brand" type="button" aria-label="返回即刻AI-PPT首页">
                <span className="brand-mark" aria-hidden="true">即</span>
                <span>即刻<strong>AI-PPT</strong></span>
              </button>
              <div className="top-actions">
                <button className="top-button" type="button" onClick={() => setHistoryOpen(true)}>
                  <span className="tiny-icon" aria-hidden="true">↺</span>
                  <span className="button-label">历史创作</span>
                </button>
                <button className="account" type="button" aria-label="账户菜单">YL</button>
              </div>
            </header>

            <main>
              <section className="hero" aria-labelledby="hero-title">
                <h1 id="hero-title">让想法<span className="accent-text">即刻成片</span></h1>

                <section className={`composer${focused ? " focused" : ""}${formError ? " has-error" : ""}`} aria-label="AI 创作输入">
                  <textarea
                    value={topic}
                    onChange={(event) => { setTopic(event.target.value); setFormError(""); }}
                    onFocus={() => setFocused(true)}
                    onBlur={() => setFocused(false)}
                    placeholder="帮我生成一份 PPT，例如：面向管理层的 2027 年产品增长策略……"
                    maxLength="1000"
                    aria-label="输入 PPT 主题或目标"
                  ></textarea>
                  {fileName ? (
                    <div className="file-chip">
                      <span>DOC</span>
                      <strong>{fileName}</strong>
                      <button type="button" onClick={() => setFileName("")} aria-label="移除文件">×</button>
                    </div>
                  ) : null}
                  {formError ? <p className="form-error" role="alert">{formError}</p> : null}
                  <div className="composer-toolbar">
                    <div className="toolbar-left">
                      <input
                        ref={fileInput}
                        type="file"
                        hidden
                        accept=".doc,.docx,.pdf,.txt,.md,.ppt,.pptx"
                        onChange={(event) => setFileName(event.target.files?.[0]?.name ?? "")}
                      />
                      <button className="upload-button" type="button" onClick={() => fileInput.current?.click()}>
                        <span aria-hidden="true">＋</span>上传文档
                      </button>
                      <div className="mode-switch" aria-label="创作模式">
                        {["自由设计", "模板复用"].map((item) => (
                          <button className={mode === item ? "active" : ""} type="button" key={item} onClick={() => setMode(item)}>{item}</button>
                        ))}
                      </div>
                    </div>
                    <button className="primary-action" type="button" onClick={generate}>立即生成&nbsp; ↗</button>
                  </div>
                </section>
              </section>

              <section className="templates" aria-labelledby="templates-title">
                <div className="section-title-row">
                  <div>
                    <h2 id="templates-title">选择模板创作</h2>
                  </div>
                  <button className="upload-template" type="button" onClick={() => window.alert("原型交互：正式版本将打开模板上传流程。")}>↑&nbsp; 上传模板</button>
                </div>

                <div className="category-scroll">
                  <div className="category-row" role="tablist" aria-label="模板分类">
                    {homepageCategories.map((category) => (
                      <button
                        className={`category-button${activeCategory === category ? " active" : ""}`}
                        type="button"
                        role="tab"
                        aria-selected={activeCategory === category}
                        key={category}
                        onClick={() => { setActiveCategory(category); setShowAll(false); }}
                      >{category}</button>
                    ))}
                  </div>
                </div>

                <div className="template-grid">
                  {visibleTemplates.map((template) => (
                    <button
                      className={`template-card${selectedTemplate === template.id ? " selected" : ""}`}
                      type="button"
                      aria-pressed={selectedTemplate === template.id}
                      key={template.id}
                      onClick={() => setSelectedTemplate(template.id)}
                    >
                      <SlidePreview tone={template.tone} />
                      <strong className="template-name">{template.name}</strong>
                      <span className="template-meta"><span>{template.meta}</span><span>预览</span></span>
                    </button>
                  ))}
                </div>

                {activeCategory === "精品推荐" ? (
                  <div className="more-wrap">
                    <button className="more-button" type="button" onClick={() => setShowAll(!showAll)}>{showAll ? "收起模板" : "查看更多模板"}</button>
                  </div>
                ) : null}
              </section>
            </main>

            <span className="prototype-badge">DESIGN PROTOTYPE · V2</span>
            {historyOpen ? <HistoryDrawer onClose={() => setHistoryOpen(false)} /> : null}
            {dialogOpen ? <GenerateDialog topic={topic} mode={mode} template={selectedTemplateName} fileName={fileName} onClose={() => setDialogOpen(false)} /> : null}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
